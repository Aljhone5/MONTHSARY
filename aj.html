<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> FIRST MONTHSARY</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
/* Looping I LOVE YOU banner 💕 */
.love-loop {
    margin-top: 20px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0;
}

.love-loop span {
    font-family: 'Georgia', serif;
    font-weight: bold;
    font-size: 1.6rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #d63384, #ff8fab, #d63384, #ff8fab);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 3s linear infinite, pulse 1.6s ease-in-out infinite;
    text-shadow: 0 2px 10px rgba(214, 51, 132, 0.15);
}

@keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

.love-loop .mini-heart {
    position: absolute;
    font-size: 0.9rem;
    opacity: 0;
    animation: floatUp 3s ease-in infinite;
}

@keyframes floatUp {
    0%   { opacity: 0; transform: translate(0, 10px) scale(0.6); }
    15%  { opacity: 1; }
    80%  { opacity: 0.6; }
    100% { opacity: 0; transform: translate(var(--dx), -60px) scale(1); }
}
        /* Surprise Cake 🎂 */
.cake-container {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    animation: popIn 0.6s ease;
}
@keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
.cake {
    position: relative;
    width: 120px;
    height: 110px;
    margin: 20px auto 0;
}
.candle {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 26px;
    background: linear-gradient(#fff, #ffd1dc);
    border-radius: 2px;
    cursor: pointer;
    z-index: 5;
}
.flame {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 16px;
    background: radial-gradient(circle at 50% 70%, #ffd54f, #ff7043 70%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.6s infinite alternate;
    transition: opacity 0.4s, transform 0.4s;
}
@keyframes flicker {
    0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
    100% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
}
.flame.blown {
    opacity: 0;
    transform: translateX(-50%) scale(0.3);
}
.smoke {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0;
    animation: smokeRise 1.2s ease forwards;
    pointer-events: none;
}
@keyframes smokeRise {
    0% { opacity: 0.8; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -30px); }
}
.frosting-top {
    position: absolute;
    top: 12px; left: 0;
    width: 100%; height: 16px;
    background: #fff0f5;
    border-radius: 50%;
    z-index: 3;
    box-shadow: 0 2px 3px rgba(0,0,0,0.08);
}
.layer-top {
    position: absolute;
    top: 20px; left: 10px;
    width: 100px; height: 35px;
    background: #f8c8dc;
    border-radius: 8px;
    z-index: 2;
}
.drip {
    position: absolute;
    top: 50px; left: 0;
    width: 100%; height: 14px;
    background: #fff0f5;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    z-index: 2;
}
.layer-bottom {
    position: absolute;
    top: 58px; left: 5px;
    width: 110px; height: 40px;
    background: #F3CFC6;
    border-radius: 6px;
    z-index: 1;
}
.plate {
    position: absolute;
    top: 100px; left: -5px;
    width: 130px; height: 10px;
    background: #e8b6c4;
    border-radius: 50%;
}
.cake-msg {
    color: #d874a6;
    font-weight: bold;
    margin-top: 16px;
    text-align: center;
    font-size: 1rem;
    line-height: 1.4;
}
        body {
            background-color: #ff95d3;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Entry Screen 🚪 */

        
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffd1dc;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s;
        }

        #enter-btn {
            background: #F8C8DC;
            color: #f8c8dc;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* The Card 💌 */
        .card {
            
            background:#F8C8DC;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            text-align: center;
            display: none; /* Hidden until Enter is clicked */
        }
        

        /* Photo Pile */
        .photo-gallery { height: 200px; position: relative; margin: 30px 0; }
        .polaroid {
            background: #F3CFC6;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: absolute;
            width: 130px;
            left: 50%;
            margin-left: -65px;
        }
        .polaroid img { width: 100%; height: 130px; object-fit: cover; }
        .p1 { transform: rotate(-8deg) translateX(-50px); }
        .p3 { transform: rotate(10deg) translateX(50px); }
        .p2 { z-index: 5; } /* Main photo in center */

        /* Ribbon & Message Box 🎀 */
        .ribbon { font-size: 2rem; display: block; margin-bottom: 5px; }
        #message-box {
            min-height: 100px;
            color: #d63384;
            font-style: italic;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Buttons 🔘 */
        .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .action-btn {
            background: #ffb6c1;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);


        }

        /* Heart Particles 🎆 */
        .heart {
            position: fixed;
            pointer-events: none;
            z-index: 99;
            animation: explode 1.5s ease-out forwards;
        }
        
        @keyframes explode {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <body>
      <div id="ribbon-container">
    <div class="ribbon-piece" style="left: 5%;  background:#ff8fab; animation-duration: 5s;   animation-delay: 0s;"></div>
    <div class="ribbon-piece" style="left: 15%; background:#d63384; animation-duration: 6s;   animation-delay: 0.5s;"></div>
    <div class="ribbon-piece" style="left: 25%; background:#ffd1dc; animation-duration: 4.5s; animation-delay: 1s;"></div>
    <div class="ribbon-piece" style="left: 35%; background:#ffffff; animation-duration: 5.5s; animation-delay: 1.5s;"></div>
    <div class="ribbon-piece" style="left: 45%; background:#F8C8DC; animation-duration: 5s;   animation-delay: 2s;"></div>
    <div class="ribbon-piece" style="left: 55%; background:#ff8fab; animation-duration: 6.5s; animation-delay: 0.3s;"></div>
    <div class="ribbon-piece" style="left: 65%; background:#d63384; animation-duration: 4.8s; animation-delay: 0.8s;"></div>
    <div class="ribbon-piece" style="left: 75%; background:#ffd1dc; animation-duration: 5.2s; animation-delay: 1.3s;"></div>
    <div class="ribbon-piece" style="left: 85%; background:#ffffff; animation-duration: 6s;   animation-delay: 1.8s;"></div>
    <div class="ribbon-piece" style="left: 95%; background:#F8C8DC; animation-duration: 4.6s; animation-delay: 2.3s;"></div>
</div>
        </div>
    <div id="overlay">
        <button id="enter-btn">🎀</button>
    </div>

    <div class="card" id="main-card">
        
        <h2 style="color: #d63384; margin-top: 0;"> FIRST MONTHSARY </h2>
        
        <div class="photo-gallery">
            <div class="polaroid p1"><img src="730zpavB.jpg"></div>
            <div class="polaroid p3"><img src="3-62U3p_.jpg"></div>
            <div class="polaroid p2"><img src="HxMGy0zj.jpg"></div>
        </div>

        <span class="ribbon">🎀</span>
        <div id="message-box"></div>

        <div class="btn-row">
            <button class="action-btn" id="note-btn">Read a Note 💌</button>
            <button class="action-btn" id="hug-btn">Virtual Hug 🫂</button>
        </div>
    </div>

    <div id="player"></div>
<audio id="bgMusic">
    <source src="The 1975 - About You (Official).mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("enter-btn").onclick = function () {
    document.getElementById("bgMusic").play();
};
</script>

    <script>
        // 1. Music Setup
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                videoId: 'bM7SZ5SbzyY', // Using the ID from your link
                playerVars: { 'start': 45, 'autoplay': 0, 'controls': 0 },
            });
        }

        

        const notes = [
            "Happy monthsary, yey  Ali This is the first day of our monthsary and 3 years has been worth for us to celebrate our first monthsary from our casual talk before and on and off of our talks its been so worth to have you to endless laughing and every single moment has been more precious because you were there..",
            "You’re now my girlfriend and my best wifey and my everything, and I’m so grateful you choose to share your life with me, your laugh and smile and beautiful gorgeous face and support to light up my days.",
            "I love how you’ve taught me what true partnership means, thank you for being my comfort and everything I can’t wait to build up lifetime of memories with you and I promise to always cherish you and the love we’ve created",
            "Here our first monthsarry its just the beginning but I’m so excited for forever with you ",
            "But Ali I know we’ve to far to each other but my loyalty to you is still here no matter who is it, no one can take me away because I love you so much not just in words but in my heart and mind I truly love you so much ali",
            "I’m so lucky to have you who is willing to understand and tolerate my personality, thankyou for everything ali I love you so much from my top and bottom of my heart I love you!"
        ];

        let currentNote = 0;

        // 2. Typewriter Effect
        function typeWriter(text, i = 0) {
            const box = document.getElementById('message-box');
            if (i === 0) box.innerHTML = '';
            if (i < text.length) {
                box.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 50);
            }
        }

        // 3. Interactions
        document.getElementById('enter-btn').addEventListener('click', () => {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('main-card').style.display = 'block';
                player.playVideo(); // Starts music at 0:45
                typeWriter(notes[0]);
            }, 1000);
        });

        document.getElementById('note-btn').addEventListener('click', () => {
            currentNote = (currentNote + 1) % notes.length;
            typeWriter(notes[currentNote]);
        });

        document.getElementById('hug-btn').addEventListener('click', (e) => {
            for(let i=0; i<15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = ['❤️', '💖', '💕'][Math.floor(Math.random()*3)];
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.setProperty('--x', (Math.random() - 0.5) * 400 + 'px');
                heart.style.setProperty('--y', (Math.random() - 0.5) * 400 + 'px');
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1500);
            }
        });
    </script>
</body>
</html>
